version: '3.8'

services:
  db-1:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-1:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      db-1:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db-1:5432/postgres

volumes:
  db-data:
